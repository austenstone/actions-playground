name: p
on: [push, workflow_dispatch]
permissions:
  issues: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          api() { curl -sS -o /tmp/b -w '%{http_code}' -X "$1" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$R/$2" ${3:+-d "$3"}; }
          api POST issues '{"title":"probe"}' >/dev/null; N=$(jq -r .number /tmp/b)
          api POST "issues/$N/comments" '{"body":"v1"}' >/dev/null; C=$(jq -r .id /tmp/b)
          P=$(api PATCH "issues/comments/$C" '{"body":"v2"}')
          echo "=== octodemo PATCH issue comment -> $P ==="
          api PATCH "issues/$N" '{"state":"closed"}' >/dev/null
