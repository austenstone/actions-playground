# Larger runners for faster builds
#
# The same compression job on 2, 8 and 32 cores. The only thing that differs
# between the three jobs is the `runs-on` label.
#
# Larger runner labels require an organization on Team or above; on accounts
# without them these jobs queue indefinitely.

name: 'Demo 4 · Larger Runners'

on:
  workflow_dispatch:
    inputs:
      payload_mb:
        description: 'Size of the workload in MB (bigger = clearer gap)'
        type: choice
        default: '512'
        options: ['256', '512', '1024']
  pull_request:
    paths:
      - '.github/workflows/demo-4-larger-runners.yml'

permissions:
  contents: read

jobs:
  build:
    # Larger runner labels require an org on Team or above. Elsewhere they
    # queue indefinitely, so this only runs where the capacity exists.
    if: github.repository_owner == 'octodemo' || github.event_name == 'workflow_dispatch'
    # The only difference between these jobs is the `runs-on` label.
    name: ${{ matrix.label }} (${{ matrix.cores }} cores)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rates: docs.github.com/billing/reference/actions-runner-pricing
          # These change; verify against the docs rather than trusting them here.
          - runs-on: ubuntu-latest
            label: Standard
            cores: 2
            per_min: 0.006
          - runs-on: 8-core
            label: Larger
            cores: 8
            per_min: 0.022
          - runs-on: 32-core
            label: Largest
            cores: 32
            per_min: 0.082

    steps:
      - name: Confirm the machine we actually got
        run: |
          echo "Label requested : ${{ matrix.runs-on }}"
          echo "Cores available : $(nproc)"
          echo "Memory          : $(free -h | awk '/^Mem:/ {print $2}')"

      - name: Generate a fixed, CPU-bound workload
        env:
          PAYLOAD_MB: ${{ inputs.payload_mb || '512' }}
        run: |
          # Same bytes on every runner, so the only variable is core count.
          dd if=/dev/urandom of=payload.bin bs=1M count="$PAYLOAD_MB" status=none
          echo "Workload: ${PAYLOAD_MB}MB"

      - name: Run the heavy job
        id: heavy
        run: |
          start=$(date +%s)
          # -T0 = one thread per core. Block size matters: xz -9 defaults to
          # 64MiB blocks, which caps a 512MB payload at ~8 threads no matter
          # how many cores exist. 8MiB blocks give ~64 units of work, so the
          # bigger machines actually get used.
          xz -9 --block-size=8MiB -T0 -c payload.bin > /dev/null
          end=$(date +%s)
          echo "elapsed=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "Elapsed: $((end - start))s on $(nproc) cores"

      - name: Report time and cost
        env:
          ELAPSED: ${{ steps.heavy.outputs.elapsed }}
          PER_MIN: ${{ matrix.per_min }}
        run: |
          # GitHub bills whole minutes, rounded UP, per job. Bill it the way
          # the invoice does — fractional minutes would understate short jobs.
          billed=$(awk -v s="$ELAPSED" 'BEGIN{printf "%d", (s+59)/60}')
          cost=$(awk -v m="$billed" -v p="$PER_MIN" 'BEGIN{printf "%.3f", m*p}')
          {
            echo "### ${{ matrix.label }} — \`${{ matrix.runs-on }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cores | $(nproc) |"
            echo "| Wall clock | **${ELAPSED}s** |"
            echo "| Billed minutes | ${billed} (rounded up) |"
            echo "| Rate | \$${PER_MIN}/min |"
            echo "| Cost of this run | \$${cost} |"
            echo ""
            echo "_Larger runners price sub-linearly: 32 cores cost 13.7x a 2-core"
            echo "runner but deliver 16x the cores. The catch is the round-up —"
            echo "a job that drops under a minute stops getting cheaper._"
          } >> "$GITHUB_STEP_SUMMARY"
