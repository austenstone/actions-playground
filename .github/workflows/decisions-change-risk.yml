name: Decisions PR risk router demo

run-name: Classify PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: decisions-pr-risk-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  route:
    name: Classify and route
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify pull request risk
        id: classify
        uses: ./.github/actions/decisions-change-risk # zizmor: ignore[self-repository] local demo action comes from the trusted checkout
        with:
          pr-number: ${{ inputs.pr_number }}
          github-token: ${{ github.token }}
          capi-token: ${{ secrets.COPILOT_CAPI_TOKEN }}

      - name: Lightweight validation route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.needs-full-test-suite == 'false'
        env:
          PROBABILITY: ${{ steps.classify.outputs.full-test-probability }}
        run: echo "Demo only - add targeted checks without suppressing required CI (full-suite probability $PROBABILITY)."

      - name: Full validation route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.needs-full-test-suite == 'true'
        env:
          PROBABILITY: ${{ steps.classify.outputs.full-test-probability }}
        run: echo "Demo only - add the full test suite without suppressing required CI (probability $PROBABILITY)."

      - name: Security review route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.security-sensitive == 'true'
        env:
          PROBABILITY: ${{ steps.classify.outputs.security-probability }}
        run: echo "Demo only - add security tooling or human review (probability $PROBABILITY)."

      - name: Deploy approval route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.needs-manual-deploy-approval == 'true'
        env:
          PROBABILITY: ${{ steps.classify.outputs.deploy-approval-probability }}
        run: echo "Demo only - request human deploy review; this workflow does not deploy (probability $PROBABILITY)."
