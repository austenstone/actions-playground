name: Decisions PR risk router demo

run-name: Classify PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: decisions-pr-risk-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  route:
    name: Classify and route
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/decisions-change-risk
          sparse-checkout-cone-mode: false

      - name: Classify pull request risk
        id: classify
        env:
          DECISIONS_GITHUB_TOKEN: ${{ github.token }}
          DECISIONS_API_TOKEN: ${{ secrets.COPILOT_CAPI_TOKEN }}
          DECISIONS_CREDENTIAL_NAME: COPILOT_CAPI_TOKEN
          DECISIONS_PROVIDER: github_capi
          DECISIONS_REPOSITORY: ${{ github.repository }}
          DECISIONS_PR_NUMBER: ${{ inputs.pr_number }}
          DECISIONS_MAX_DIFF_CHARACTERS: '60000'
          DECISIONS_MAX_FILES: '100'
          DECISIONS_SECURITY_THRESHOLD: '0.65'
          DECISIONS_FULL_TEST_THRESHOLD: '0.55'
          DECISIONS_DEPLOY_APPROVAL_THRESHOLD: '0.60'
          DECISIONS_DOCS_ONLY_THRESHOLD: '0.80'
        run: python3 .github/scripts/decisions-change-risk/decisions_change_risk.py

      - name: Lightweight validation route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.needs-full-test-suite == 'false'
        run: echo "Demo only - add targeted checks without suppressing required CI."

      - name: Full validation route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.needs-full-test-suite == 'true'
        run: echo "Demo only - add the full test suite without suppressing required CI."

      - name: Security review route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.security-sensitive == 'true'
        run: echo "Demo only - add security tooling or human review."

      - name: Deploy approval route
        if: steps.classify.outputs.classification-available == 'true' && steps.classify.outputs.needs-manual-deploy-approval == 'true'
        run: echo "Demo only - request human deploy review; this workflow does not deploy."
