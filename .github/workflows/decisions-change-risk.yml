name: OpenAI Decisions change-risk experiment

run-name: Decisions risk for PR #${{ github.event.pull_request.number || inputs.pr_number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to classify
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: decisions-change-risk-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-validation:
    name: Baseline validation (always)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout trusted router code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/decisions-change-risk
          sparse-checkout-cone-mode: false

      - name: Run deterministic baseline tests
        run: python3 -m unittest discover -s .github/scripts/decisions-change-risk -p 'test_*.py'

  classify-change-risk:
    name: Classify change risk
    needs: baseline-validation
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      classification-available: ${{ steps.classify.outputs.classification-available }}
      classification-status: ${{ steps.classify.outputs.classification-status }}
      model: ${{ steps.classify.outputs.model }}
      latency-ms: ${{ steps.classify.outputs.latency-ms }}
      input-tokens: ${{ steps.classify.outputs.input-tokens }}
      files-considered: ${{ steps.classify.outputs.files-considered }}
      diff-truncated: ${{ steps.classify.outputs.diff-truncated }}
      security-sensitive: ${{ steps.classify.outputs.security-sensitive }}
      security-probability: ${{ steps.classify.outputs.security-probability }}
      needs-full-test-suite: ${{ steps.classify.outputs.needs-full-test-suite }}
      full-test-probability: ${{ steps.classify.outputs.full-test-probability }}
      needs-manual-deploy-approval: ${{ steps.classify.outputs.needs-manual-deploy-approval }}
      deploy-approval-probability: ${{ steps.classify.outputs.deploy-approval-probability }}
      docs-only: ${{ steps.classify.outputs.docs-only }}
      docs-only-probability: ${{ steps.classify.outputs.docs-only-probability }}
    steps:
      - name: Checkout trusted router code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/decisions-change-risk
          sparse-checkout-cone-mode: false

      - name: Run Decisions classifier
        id: classify
        env:
          DECISIONS_GITHUB_TOKEN: ${{ github.token }}
          DECISIONS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DECISIONS_REPOSITORY: ${{ github.repository }}
          DECISIONS_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DECISIONS_SKIP_REASON: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'Fork pull request: repository secrets are unavailable by design.' || '' }}"
          DECISIONS_MAX_DIFF_CHARACTERS: '60000'
          DECISIONS_MAX_FILES: '100'
          DECISIONS_SECURITY_THRESHOLD: '0.65'
          DECISIONS_FULL_TEST_THRESHOLD: '0.55'
          DECISIONS_DEPLOY_APPROVAL_THRESHOLD: '0.60'
          DECISIONS_DOCS_ONLY_THRESHOLD: '0.80'
        run: python3 .github/scripts/decisions-change-risk/decisions_change_risk.py

  lightweight-validation:
    name: Lightweight validation demo
    needs: classify-change-risk
    if: needs.classify-change-risk.outputs.classification-available == 'true' && needs.classify-change-risk.outputs.needs-full-test-suite == 'false'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Demonstrate lightweight route
        run: echo "Baseline validation already ran; this low-risk route adds only targeted checks."

  full-validation:
    name: Full validation demo
    needs: classify-change-risk
    if: needs.classify-change-risk.outputs.classification-available == 'true' && needs.classify-change-risk.outputs.needs-full-test-suite == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Demonstrate full validation route
        run: echo "Run the repository's full test matrix here without suppressing baseline checks."

  security-review:
    name: Security review demo
    needs: classify-change-risk
    if: needs.classify-change-risk.outputs.classification-available == 'true' && needs.classify-change-risk.outputs.security-sensitive == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Demonstrate security review route
        run: echo "Run additional security tooling or require a security review here."

  deploy-review:
    name: Deploy review demo
    needs: classify-change-risk
    if: needs.classify-change-risk.outputs.classification-available == 'true' && needs.classify-change-risk.outputs.needs-manual-deploy-approval == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Demonstrate deploy review route
        run: echo "Request human deploy review here; this experiment does not deploy anything."
